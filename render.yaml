services:
  # ---------------------------------------------------------------------------
  # Backend REST API Service
  # ---------------------------------------------------------------------------
  - type: web
    name: matrucare-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM_NAME
        value: MatruCare AI
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: CONTACT_RECEIVER_EMAIL
        sync: false

  # ---------------------------------------------------------------------------
  # Frontend React (Vite) Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: matrucare-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
